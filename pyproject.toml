[project]
name = "maie"
version = "0.1.0"
description = "Marketplace Arbitrage Intelligence Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "duckdb>=1.1.0",
    "loguru>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
maie = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "core",
    "collectors",
    "analysis",
    "analytics",
    "categories",
    "database",
    "alerts",
    "dashboard",
    "config",
    "models",
    "scripts",
]
